<!DOCTYPE html>
<!-- Объявляет тип документа: браузер будет разбирать страницу как HTML5 -->

<html lang="ru">
<!-- Корневой элемент страницы; lang задаёт язык содержимого -->

<head>
<!-- Служебная информация: кодировка, viewport, заголовок, стили — не отображается на странице -->

  <meta charset="UTF-8">
  <!-- Кодировка символов: UTF-8 корректно показывает кириллицу и спецсимволы -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Viewport: ширина равна ширине устройства, начальный масштаб 1 — страница адаптируется к экрану -->

  <title>Frontend Day 1</title>
  <!-- Текст вкладки браузера и заголовок в истории/закладках -->

  <link rel="stylesheet" href="style.css">
  <!-- Подключает внешнюю таблицу стилей style.css -->

</head>

<body>
<!-- Видимое содержимое страницы -->

</body>

</html>
<!-- Закрывает корневой элемент html -->
